name: NivaraPatient
options:
  bundleIdPrefix: com.nivara
  deploymentTarget:
    iOS: "16.0"
targets:
  NivaraPatient:
    type: application
    platform: iOS
    sources:
      - NivaraPatient
    info:
      path: NivaraPatient/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nivara.patient
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Force Xcode to use ONLY NivaraPatient/Info.plist (with our
        # UILaunchScreen key) rather than auto-generating a competing one
        # from INFOPLIST_KEY_* build settings, which don't include it.
        GENERATE_INFOPLIST_FILE: "NO"
        # Fill in your personal team ID so `xcodegen generate` doesn't wipe
        # out signing every time it regenerates the .xcodeproj. Find it via
        # Xcode > Settings > Accounts > (your Apple ID) > your team, or after
        # signing once in Xcode's GUI: grep DEVELOPMENT_TEAM
        # NivaraPatient.xcodeproj/project.pbxproj
        # DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
