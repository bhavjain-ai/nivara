name: NivaraPatient
options:
  bundleIdPrefix: com.nivara
  deploymentTarget:
    iOS: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  NivaraPatient:
    type: application
    platform: iOS
    sources:
      - NivaraPatient
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nivara.patient
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # This Xcode version keeps forcing a build-setting-generated
        # Info.plist regardless of GENERATE_INFOPLIST_FILE=NO + a physical
        # file (it was silently rewriting NivaraPatient/Info.plist back to
        # its own template on every open/build, dropping our custom keys —
        # including UILaunchScreen, which caused the app to render
        # letterboxed at an old fixed size). Instead of fighting that,
        # go all-in on generated mode and supply everything as
        # INFOPLIST_KEY_* build settings, which Xcode's generator reads
        # directly no matter what triggers a regeneration.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Nivara"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nivara uses Bluetooth to read live readings from your connected blood pressure cuff and glucose meter."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Nivara uses Bluetooth to read live readings from your connected blood pressure cuff and glucose meter."
        # Fill in your personal team ID so `xcodegen generate` doesn't wipe
        # out signing every time it regenerates the .xcodeproj. Find it via
        # Xcode > Settings > Accounts > (your Apple ID) > your team, or after
        # signing once in Xcode's GUI: grep DEVELOPMENT_TEAM
        # NivaraPatient.xcodeproj/project.pbxproj
        # DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
